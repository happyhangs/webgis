<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/point-tool-icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a73e8" />
    <title>点位工具</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__webgisErrors = [];
      function showRuntimeError(message, stack) {
        window.__webgisErrors.push({ message: String(message || ''), stack: String(stack || ''), time: Date.now() });
        var old = document.getElementById('runtime-error-banner');
        if (old) old.remove();
        var box = document.createElement('details');
        box.id = 'runtime-error-banner';
        box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;max-height:38vh;overflow:auto;padding:10px 12px;border:1px solid #efb0b0;border-radius:8px;background:#fff8f8;color:#8a1f1f;font:12px Consolas,monospace;box-shadow:0 8px 24px rgba(0,0,0,.16)';
        var summary = document.createElement('summary');
        summary.textContent = '运行时错误：' + String(message || '未知错误');
        var pre = document.createElement('pre');
        pre.style.whiteSpace = 'pre-wrap';
        pre.style.marginTop = '8px';
        pre.textContent = String(stack || '');
        box.appendChild(summary);
        box.appendChild(pre);
        document.body.appendChild(box);
        var root = document.getElementById('root');
        if (root && !root.textContent.trim()) {
          var fallback = document.createElement('div');
          fallback.style.cssText = 'min-height:100vh;display:grid;place-items:center;padding:24px;background:#eef1f0;color:#202725;font:14px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif';
          fallback.innerHTML = '<div style="max-width:720px;width:100%;padding:18px;border:1px solid #efb0b0;border-radius:8px;background:#fff8f8;box-shadow:0 10px 28px rgba(0,0,0,.12)"><strong style="display:block;margin-bottom:8px;color:#8a1f1f">页面启动失败</strong><div style="margin-bottom:10px">' + String(message || '未知错误') + '</div><button id="startup-reset" style="height:34px;margin-bottom:12px;padding:0 12px;border:0;border-radius:7px;background:#bd3030;color:#fff;cursor:pointer;font-weight:800">清空本地缓存并刷新</button><pre style="white-space:pre-wrap;max-height:42vh;overflow:auto;font:12px Consolas,monospace;color:#6a1a1a">' + String(stack || '') + '</pre></div>';
          root.appendChild(fallback);
          var reset = document.getElementById('startup-reset');
          if (reset) reset.onclick = function() { localStorage.removeItem('webgis_state'); location.reload(); };
        }
      }
      window.addEventListener('error', function(event) {
        showRuntimeError(event.error && event.error.message ? event.error.message : event.message, event.error && event.error.stack ? event.error.stack : event.filename + ':' + event.lineno + ':' + event.colno);
      });
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason || {};
        showRuntimeError(reason.message || reason, reason.stack || '');
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
